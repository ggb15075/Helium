name: Build RootHide deb

on:
  workflow_dispatch:
  push:
    branches:
      - roothide-build

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Check out Helium
        uses: actions/checkout@v4

      - name: Select Xcode 15.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Install build tools
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install dpkg ldid make libplist openssl@3
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Check out RootHide Theos
        uses: actions/checkout@v4
        with:
          repository: roothide/theos
          ref: 88506b2c22e9e07dd4ed055f23c9e398a117a2c7
          path: theos
          submodules: recursive

      - name: Replace bundled SDK directory
        run: rm -rf "$GITHUB_WORKSPACE/theos/sdks"

      - name: Check out iOS SDKs
        uses: actions/checkout@v4
        with:
          repository: theos/sdks
          ref: 0222fd5413cf4b9af096f37b4621afa2688572f7
          path: theos/sdks

      - name: Build RootHide package
        env:
          THEOS: ${{ github.workspace }}/theos
        run: sh build-roothide.sh

      - name: Verify RootHide deb
        run: |
          set -eu
          deb=$(find packages -maxdepth 1 -name '*_iphoneos-arm64e.deb' -print -quit)
          test -n "$deb"
          test "$(dpkg-deb -f "$deb" Architecture)" = 'iphoneos-arm64e'
          test "$(dpkg-deb -f "$deb" Version)" = '3.2.6-2'
          control="$RUNNER_TEMP/helium-control"
          mkdir -p "$control"
          dpkg-deb -e "$deb" "$control"
          for script in postinst prerm postrm; do
            test -x "$control/$script"
            sh -n "$control/$script"
          done
          extracted="$RUNNER_TEMP/helium-deb"
          mkdir -p "$extracted"
          dpkg-deb -x "$deb" "$extracted"
          test -x "$extracted/Applications/Helium.app/Helium"
          test -f "$extracted/Applications/Helium.app/Info.plist"
          test -f "$extracted/Library/LaunchDaemons/com.leemin.helium.plist"
          ldid -e "$extracted/Applications/Helium.app/Helium" > "$RUNNER_TEMP/helium-entitlements.plist"
          for entitlement in platform-application com.apple.private.security.no-sandbox com.apple.private.security.storage.AppBundles com.apple.private.security.storage.AppDataContainers; do
            grep -q "<key>$entitlement</key>" "$RUNNER_TEMP/helium-entitlements.plist"
          done

      - name: Upload RootHide deb
        uses: actions/upload-artifact@v4
        with:
          name: Helium-RootHide-deb
          path: packages/*_iphoneos-arm64e.deb
          if-no-files-found: error
